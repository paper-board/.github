name: docs-deploy

on:
  repository_dispatch:
    types: [docs-content-changed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: docs

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Aggregate multi-repo docs
        env:
          # gh CLI auto-reads GITHUB_TOKEN env var; cross-repo clone access
          # requires DOCS_DISPATCH_PAT (default GITHUB_TOKEN is scoped to .github
          # repo only and cannot clone sibling paper-board service repos).
          GITHUB_TOKEN: ${{ secrets.DOCS_DISPATCH_PAT }}
        run: ./scripts/aggregate-docs.sh
        working-directory: docs

      - name: Validate frontmatter
        run: ./scripts/validate-frontmatter.sh content
        working-directory: docs

      - name: Validate code snippets
        env:
          WORKDIR: ${{ github.workspace }}/..
        run: ./scripts/validate-code-snippets.sh content
        working-directory: docs

      - name: Astro build
        run: npm run build
        working-directory: docs

      - name: Resolve deploy branch
        id: deploy-branch
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "branch=${{ github.event.client_payload.branch || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=paperboard-docs --branch=${{ steps.deploy-branch.outputs.branch }}

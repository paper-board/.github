name: docs-deploy

on:
  repository_dispatch:
    types: [docs-content-changed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: docs

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Aggregate multi-repo docs
        env:
          # gh CLI auto-reads GITHUB_TOKEN env var; cross-repo clone access
          # requires DOCS_DISPATCH_PAT (default GITHUB_TOKEN is scoped to .github
          # repo only and cannot clone sibling paper-board service repos).
          GITHUB_TOKEN: ${{ secrets.DOCS_DISPATCH_PAT }}
        run: ./scripts/aggregate-docs.sh
        working-directory: docs

      - name: Generate ADR index
        run: node scripts/generate-adr-index.js
        working-directory: docs

      - name: Derive glossary
        run: node scripts/derive-glossary.js
        working-directory: docs

      - name: Validate frontmatter (controlled paths only)
        # Mirror sources (standards/, decisions/) and aggregated service docs
        # follow their own conventions or pre-existing schemas. Validator runs
        # only against the paths whose content we author + own in this Sprint:
        # onboarding (S2), architecture (S2), operations (S1/S3).
        # Validator script expects a directory; skip paths that haven't been
        # created yet (pre-S2/S3 bootstrap state). Top-level homepage was
        # CR-reviewed in S1 PR #18; no per-build re-validation needed.
        run: |
          for dir in content/docs/onboarding content/docs/architecture content/docs/operations; do
            if [[ -d "$dir" ]]; then
              ./scripts/validate-frontmatter.sh "$dir" || exit $?
            else
              echo "skip: $dir not yet created"
            fi
          done
        working-directory: docs

      - name: Clone sibling paper-board repos for snippet path resolution
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_DISPATCH_PAT }}
        # validate-code-snippets.sh resolves "// from paper-board/<repo>/<path>"
        # against <WORKDIR>/paper-board/<repo>/<path>. Default CI checkout
        # only has .github at <workspace>; siblings must be cloned explicitly
        # so the validator can read the referenced source files. Aggregator
        # step above only clones docs/ to mktemp tmp dirs, not full repos.
        run: |
          WORKDIR="${{ github.workspace }}/.."
          mkdir -p "${WORKDIR}/paper-board"
          while IFS= read -r repo; do
            [[ -z "${repo}" || "${repo}" =~ ^# ]] && continue
            target="${WORKDIR}/${repo}"
            if [[ -d "${target}/.git" ]]; then
              echo "exists: ${repo}"
              continue
            fi
            echo "clone: ${repo} -> ${target}"
            mkdir -p "$(dirname "${target}")"
            if ! gh_out=$(gh repo clone "${repo}" "${target}" -- --depth=1 --quiet 2>&1); then
              echo "WARN: clone failed for ${repo}: ${gh_out}"
              echo "    snippets referencing this repo will report MISSING_FILE"
            fi
          done < docs/scripts/repos.txt

      - name: Validate code snippets (controlled paths only)
        env:
          WORKDIR: ${{ github.workspace }}/..
        # Same scope + same conditional skip as frontmatter validation.
        # Sibling repos cloned in the preceding step provide source files
        # for path resolution.
        run: |
          for dir in content/docs/onboarding content/docs/architecture content/docs/operations; do
            if [[ -d "$dir" ]]; then
              ./scripts/validate-code-snippets.sh "$dir" || exit $?
            else
              echo "skip: $dir not yet created"
            fi
          done
        working-directory: docs

      - name: Astro build
        run: npm run build
        working-directory: docs

      - name: Resolve deploy branch
        id: deploy-branch
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "branch=${{ github.event.client_payload.branch || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=paperboard-docs --branch=${{ steps.deploy-branch.outputs.branch }}

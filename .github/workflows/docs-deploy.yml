name: docs-deploy

on:
  repository_dispatch:
    types: [docs-content-changed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout .github repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: docs

      - name: Setup gh CLI auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | gh auth login --with-token

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Aggregate multi-repo docs
        run: ./scripts/aggregate-docs.sh
        working-directory: docs

      - name: Validate frontmatter
        run: ./scripts/validate-frontmatter.sh docs/content

      - name: Validate code snippets
        env:
          WORKDIR: ${{ github.workspace }}/..
        run: ./scripts/validate-code-snippets.sh docs/content

      - name: Astro build
        run: npm run build
        working-directory: docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=paperboard-docs --branch=${{ github.event_name == 'push' && 'main' || github.ref_name }}

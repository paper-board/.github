# Reusable release-please workflow for paper-board Go modules (sdk, proto, services).
# Service repo wires:
#   # .github/workflows/release-please.yaml
#   name: release-please
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release-please:
#       uses: paper-board/.github/.github/workflow-templates/release-please.yaml@main
#       with:
#         release-type: go
#       secrets: inherit
#
# Conventional Commits → release PR → squash-merge → tag + GitHub Release.
# Spec: agent-manager/docs/standards/build-release.md §3.3.

name: Release Please

on:
  workflow_call:
    inputs:
      release-type:
        type: string
        default: "go"
      package-name:
        type: string
        default: ""
      default-branch:
        type: string
        default: "main"

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.release-type }}
          package-name: ${{ inputs.package-name != '' && inputs.package-name || github.event.repository.name }}
          default-branch: ${{ inputs.default-branch }}

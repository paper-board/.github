# Reusable workflow: build + push + Trivy scan.
# cosign + SBOM deferred to Phase 5 (see comment in `release` job).
name: Release Image

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true   # e.g., "identity-migrator"
      dockerfile-path:
        type: string
        default: "Dockerfile"
      build-context:
        type: string
        default: "."
    secrets:
      GHCR_TOKEN:
        required: true
      COSIGN_KEY:
        required: false  # Phase 5+ (consumed by deferred cosign sign step)
      COSIGN_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build + push
        uses: docker/build-push-action@v6
        id: docker
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: |
            ghcr.io/paper-board/${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
            ghcr.io/paper-board/${{ inputs.image-name }}:latest

      # Phase 5: cosign + SBOM (placeholder)
      #
      # When Phase 5 production cutover begins, these steps will be enabled:
      #  - Install cosign
      #  - Sign image (keyless OIDC or KMS-backed)
      #  - Generate SBOM (syft) and attach
      #
      # Phase 5 open decisions:
      #  - Keyless (Fulcio/Sigstore) vs KMS-backed
      #  - SBOM format: SPDX vs CycloneDX
      #  - Verification: Kyverno admission controller vs OPA Gatekeeper
      #
      # Tracking: paper-board/.github#<issue> (opened when Phase 5 scope materializes)

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: ghcr.io/paper-board/${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

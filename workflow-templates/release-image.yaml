# Reusable workflow: build + push + cosign + SBOM
# Phase 1.5'te activate (cosign + Syft).
name: Release Image

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true   # e.g., "identity-migrator"
      dockerfile-path:
        type: string
        default: "Dockerfile"
      build-context:
        type: string
        default: "."
    secrets:
      GHCR_TOKEN:
        required: true
      COSIGN_KEY:
        required: false  # Phase 1.5+
      COSIGN_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build + push
        uses: docker/build-push-action@v6
        id: docker
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: |
            ghcr.io/paper-board/${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
            ghcr.io/paper-board/${{ inputs.image-name }}:latest

      - name: Install cosign
        if: ${{ secrets.COSIGN_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: ${{ secrets.COSIGN_KEY != '' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_KEY \
            ghcr.io/paper-board/${{ inputs.image-name }}@${{ steps.docker.outputs.digest }}

      - name: Generate SBOM
        if: ${{ secrets.COSIGN_KEY != '' }}
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/paper-board/${{ inputs.image-name }}@${{ steps.docker.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ inputs.image-name }}.spdx.json

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: ghcr.io/paper-board/${{ inputs.image-name }}:${{ steps.version.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
